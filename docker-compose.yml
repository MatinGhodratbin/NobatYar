services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nobatyar_app
    volumes:
      - ./backend:/var/www/html
    working_dir: /var/www/html
    depends_on:
      - mysql
      - redis
    networks:
      - nobatyar

  nginx:
    image: nginx:1.27-alpine
    container_name: nobatyar_nginx
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - nobatyar

  mysql:
    image: mysql:8.0
    container_name: nobatyar_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: nobatyar
      MYSQL_USER: nobatyar
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - nobatyar_mysql_data:/var/lib/mysql
    networks:
      - nobatyar

  redis:
    image: redis:7-alpine
    container_name: nobatyar_redis
    ports:
      - "6379:6379"
    networks:
      - nobatyar

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nobatyar_frontend
    volumes:
      - ./frontend:/app
    working_dir: /app
    ports:
      - "5173:5173"
    depends_on:
      - nginx
    networks:
      - nobatyar

  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nobatyar_reverb
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    volumes:
      - ./backend:/var/www/html
    working_dir: /var/www/html
    ports:
      - "8081:8080"
    depends_on:
      - mysql
      - redis
    networks:
      - nobatyar

  queue-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nobatyar_queue_worker
    command: php artisan queue:work --tries=3 --backoff=5
    volumes:
      - ./backend:/var/www/html
    working_dir: /var/www/html
    depends_on:
      - mysql
      - redis
    networks:
      - nobatyar

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nobatyar_scheduler
    command: php artisan schedule:work
    volumes:
      - ./backend:/var/www/html
    working_dir: /var/www/html
    depends_on:
      - mysql
      - redis
    networks:
      - nobatyar

networks:
  nobatyar:
    driver: bridge

volumes:
  nobatyar_mysql_data: